[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kopy-lang"
version = "0.5.22"
description = "KoPy: Korean-transliterated Python compatibility and learning layer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "KoPy Project" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]
keywords = ["python", "korean", "education", "transliteration", "learning", "numpy", "pandas", "polars", "dataframe", "scipy", "scikit-learn", "xgboost", "lightgbm", "gradient-boosting", "pytorch", "torchvision", "timm", "pytorch-image-models", "computer-vision", "image-transforms", "jax", "autodiff", "jit", "opencv", "image-processing", "transformers", "datasets", "tokenizers", "accelerate", "peft", "lora", "onnxruntime", "onnx", "safetensors", "optimum", "sentencepiece", "mlflow", "matplotlib", "visualization", "scientific-computing", "experiment-tracking", "huggingface", "ai"]
dependencies = []

[project.urls]
Homepage = "https://github.com/gpt0081/KoPy"
Repository = "https://github.com/gpt0081/KoPy"
Issues = "https://github.com/gpt0081/KoPy/issues"

[project.scripts]
kopy = "kopy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
