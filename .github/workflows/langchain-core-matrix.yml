name: LangChain Core Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/kopy/packs/langchain_core.py"
      - "src/kopy/packs/registry.py"
      - "tests/test_langchain_core_*.py"
      - ".github/workflows/langchain-core-matrix.yml"
  push:
    branches: [main]
    paths:
      - "src/kopy/packs/langchain_core.py"
      - "src/kopy/packs/registry.py"
      - "tests/test_langchain_core_*.py"
      - ".github/workflows/langchain-core-matrix.yml"

jobs:
  langchain-core:
    name: LangChain Core 1.6 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install KoPy and LangChain Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "langchain-core>=1.6,<1.7"
      - name: Run LangChain Core pack tests
        run: python -m unittest tests.test_langchain_core_pack tests.test_langchain_core_runtime -v
      - name: Verify LangChain Core pack details
        run: kopy packs langchain-core
