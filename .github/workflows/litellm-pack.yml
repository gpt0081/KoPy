name: LiteLLM Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/kopy/packs/litellm.py"
      - "src/kopy/packs/registry.py"
      - "tests/test_litellm_*.py"
      - ".github/workflows/litellm-pack.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/kopy/packs/litellm.py"
      - "src/kopy/packs/registry.py"
      - "tests/test_litellm_*.py"
      - ".github/workflows/litellm-pack.yml"

jobs:
  litellm-pack:
    name: LiteLLM 1.98.0 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install KoPy and LiteLLM
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "litellm==1.98.0"
      - name: Run LiteLLM pack and real-library runtime tests
        run: python -m unittest tests.test_litellm_pack tests.test_litellm_runtime -v
      - name: Verify LiteLLM pack details
        run: kopy packs litellm
