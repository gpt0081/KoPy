name: AI Pack Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/kopy/**"
      - "tests/**"
      - ".github/workflows/ai-pack-matrix.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/kopy/**"
      - "tests/**"
      - ".github/workflows/ai-pack-matrix.yml"

jobs:
  ai-packs:
    name: NumPy 2.5 + pandas 3.0 + Polars 1.43 + SciPy 1.18 + sklearn 1.9 + XGBoost 3.4 + LightGBM 4.7 + PyTorch 2.13 + TorchVision 0.28 + PyG 2.8 + timm 1.0 + Kornia 0.8 + einops 0.8 + JAX 0.11 + OpenCV 5.0 + Lightning 2.6 + TorchMetrics 1.9 + HF stack + Sentence Transformers 6.0 + FastEmbed 0.8 + FAISS 1.15 + Qdrant Client 1.19 + Chroma 1.5 + BM25S 0.3 + ranx 0.3 + ir-measures 0.4 + Ragas 0.4 + Optuna 4.9 + ONNX + MLflow Skinny 3.15 + Matplotlib 3.11 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install KoPy AI libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "numpy>=2.5,<2.6" "pandas>=3.0,<3.1" "polars>=1.43.2,<1.44" "scipy>=1.18,<1.19" "scikit-learn>=1.9,<1.10" "xgboost>=3.4,<3.5" "lightgbm>=4.7,<4.8" "torch>=2.13,<2.14" "torchvision>=0.28,<0.29" "torch-geometric>=2.8.0.post1,<2.9" "timm>=1.0.28,<1.1" "kornia>=0.8.3,<0.9" "einops>=0.8.2,<0.9" "jax>=0.11.1,<0.12" "opencv-python-headless==5.0.0.93" "lightning>=2.6.5,<2.7" "torchmetrics>=1.9,<1.10" "transformers>=5.15,<5.16" "sentence-transformers>=6.0,<6.1" "fastembed>=0.8,<0.9" "faiss-cpu>=1.15,<1.16" "qdrant-client>=1.19,<1.20" "chromadb>=1.5.9,<1.6" "bm25s>=0.3.10,<0.4" "ranx>=0.3.21,<0.4" "ir-measures>=0.4.3,<0.5" "ragas>=0.4.3,<0.5" "datasets>=4.8,<4.9" "tokenizers>=0.22.2,<0.23" "accelerate>=1.14,<1.15" "peft>=0.20,<0.21" "onnxruntime>=1.28,<1.29" "onnx>=1.22,<1.23" "safetensors>=0.8,<0.9" "optimum>=2.3,<2.4" "sentencepiece>=0.2.2,<0.3" "optuna>=4.9,<5" "mlflow-skinny>=3.15,<3.16" "matplotlib>=3.11,<3.12"

      - name: Run KoPy test suite
        env:
          RAGAS_DO_NOT_TRACK: "true"
        run: python -m unittest discover -s tests -v

      - name: Show library packs
        run: kopy packs

      - name: Verify NumPy pack details
        run: kopy packs numpy
      - name: Verify pandas pack details
        run: kopy packs pandas
      - name: Verify Polars pack details
        run: kopy packs polars
      - name: Verify SciPy pack details
        run: kopy packs scipy
      - name: Verify scikit-learn pack details
        run: kopy packs scikit-learn
      - name: Verify XGBoost pack details
        run: kopy packs xgboost
      - name: Verify LightGBM pack details
        run: kopy packs lightgbm
      - name: Verify PyTorch pack details
        run: kopy packs pytorch
      - name: Verify TorchVision pack details
        run: kopy packs torchvision
      - name: Verify PyTorch Geometric pack details
        run: kopy packs pytorch-geometric
      - name: Verify timm pack details
        run: kopy packs timm
      - name: Verify Kornia pack details
        run: kopy packs kornia
      - name: Verify einops pack details
        run: kopy packs einops
      - name: Verify JAX pack details
        run: kopy packs jax
      - name: Verify OpenCV pack details
        run: kopy packs opencv
      - name: Verify Lightning pack details
        run: kopy packs lightning
      - name: Verify TorchMetrics pack details
        run: kopy packs torchmetrics
      - name: Verify Transformers pack details
        run: kopy packs transformers
      - name: Verify Sentence Transformers pack details
        run: kopy packs sentence-transformers
      - name: Verify FastEmbed pack details
        run: kopy packs fastembed
      - name: Verify FAISS pack details
        run: kopy packs faiss
      - name: Verify Qdrant Client pack details
        run: kopy packs qdrant-client
      - name: Verify Chroma pack details
        run: kopy packs chroma
      - name: Verify BM25S pack details
        run: kopy packs bm25s
      - name: Verify ranx pack details
        run: kopy packs ranx
      - name: Verify ir-measures pack details
        run: kopy packs ir-measures
      - name: Verify Ragas pack details
        run: kopy packs ragas
      - name: Verify Datasets pack details
        run: kopy packs datasets
      - name: Verify Tokenizers pack details
        run: kopy packs tokenizers
      - name: Verify Accelerate pack details
        run: kopy packs accelerate
      - name: Verify PEFT pack details
        run: kopy packs peft
      - name: Verify ONNX Runtime pack details
        run: kopy packs onnxruntime
      - name: Verify Safetensors pack details
        run: kopy packs safetensors
      - name: Verify Optimum pack details
        run: kopy packs optimum
      - name: Verify SentencePiece pack details
        run: kopy packs sentencepiece
      - name: Verify Optuna pack details
        run: kopy packs optuna
      - name: Verify MLflow pack details
        run: kopy packs mlflow
      - name: Verify Matplotlib pack details
        run: kopy packs matplotlib

  mlflow-full:
    name: Full MLflow 3.15 runtime / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install full MLflow
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "mlflow>=3.15,<3.16"

      - name: Run MLflow pack tests
        run: python -m unittest tests.test_mlflow_pack tests.test_mlflow_runtime -v

      - name: Verify MLflow pack details
        run: kopy packs mlflow
