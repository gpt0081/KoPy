name: AI Pack Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/kopy/**"
      - "tests/**"
      - ".github/workflows/ai-pack-matrix.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/kopy/**"
      - "tests/**"
      - ".github/workflows/ai-pack-matrix.yml"

jobs:
  ai-packs:
    name: NumPy 2.5 + pandas 3.0 + scikit-learn 1.9 + PyTorch 2.13 + Transformers 5.15 + Datasets 4.8 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install KoPy AI libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "numpy>=2.5,<2.6" "pandas>=3.0,<3.1" "scikit-learn>=1.9,<1.10" "torch>=2.13,<2.14" "transformers>=5.15,<5.16" "datasets>=4.8,<4.9"

      - name: Run KoPy test suite
        run: python -m unittest discover -s tests -v

      - name: Show library packs
        run: kopy packs

      - name: Verify NumPy pack details
        run: kopy packs numpy

      - name: Verify pandas pack details
        run: kopy packs pandas

      - name: Verify scikit-learn pack details
        run: kopy packs scikit-learn

      - name: Verify PyTorch pack details
        run: kopy packs pytorch

      - name: Verify Transformers pack details
        run: kopy packs transformers

      - name: Verify Datasets pack details
        run: kopy packs datasets
