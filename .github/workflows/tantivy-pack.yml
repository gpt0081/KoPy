name: Tantivy Pack

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/kopy/packs/tantivy.py"
      - "src/kopy/packs/registry.py"
      - "tests/test_tantivy_*.py"
      - ".github/workflows/tantivy-pack.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/kopy/packs/tantivy.py"
      - "src/kopy/packs/registry.py"
      - "tests/test_tantivy_*.py"
      - ".github/workflows/tantivy-pack.yml"
      - "pyproject.toml"

jobs:
  tantivy-runtime:
    name: Tantivy 0.26 runtime / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install KoPy and Tantivy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "tantivy>=0.26,<0.27"
      - name: Run Tantivy pack tests
        run: python -m unittest tests.test_tantivy_pack tests.test_tantivy_runtime -v
      - name: Verify Tantivy pack details
        run: kopy packs tantivy
