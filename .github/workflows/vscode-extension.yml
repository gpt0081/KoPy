name: VS Code Extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"

jobs:
  package-vsix:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check extension JavaScript
        run: node --check extension.js

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: KoPy-VSCode-v0.3.0
          path: vscode-extension/*.vsix
