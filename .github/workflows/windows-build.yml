name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.20,<7"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: python -m PyInstaller --clean --onefile --name kopy --paths src src/kopy/__main__.py

      - name: Smoke test
        run: dist\kopy.exe version

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: KoPy-Windows
          path: dist/kopy.exe
